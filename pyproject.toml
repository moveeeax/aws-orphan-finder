[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-orphan-finder"
version = "0.3.0"
description = "Find orphaned and idle AWS resources (EIPs, EBS volumes, ENIs, snapshots, AMIs, stopped instances, load balancers, NAT gateways) and estimate monthly waste."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Tarassov", email = "michael@tarassov.me" }]
keywords = ["aws", "cost", "finops", "ebs", "eip", "cleanup", "boto3"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3>=1.35",
    "rich>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/moveeeax/aws-orphan-finder"
Repository = "https://github.com/moveeeax/aws-orphan-finder"

[project.scripts]
aws-orphan-finder = "aws_orphan_finder.cli:main"

[tool.setuptools]
packages = ["aws_orphan_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
